corrected_manifold:
      _target_: src.manifolds.euclidean.L2CorrectedEuclideanManifold
      base_manifold_params:
            d: 3
      alpha: 1e-3
      beta: 1.

optimizer:
      _target_: torch.optim.Adam
      lr: 1e-5
      weight_decay: 0.

scheduler: null

training_params:
      seed: 42
      batch_size: 1
      max_epochs: 1000
      accelerator: cpu
      devices: 1
      trainer_root_dir: null
      ckpt_path: null
      log_dir: lightning_logs
      name: default

plotter:
      _target_: src.utils.callbacks.SineExperimentsLogger
      start_epoch: 0
      freq: 200